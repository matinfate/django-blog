{% extends "blog/base.html" %}
{% load jalali_tags %}

{% block title %}فهرست پست‌ها{% endblock %}

{% block content %}
    {% for post in posts %}
        <h2><a href="{% url 'blog:post_detail' pk=post.pk %}">{{ post.title }}</a></h2>
        <time>{{ post.created_at|jalali }}</time>
    {% endfor %}
{% endblock %}
