{% extends "blog/base.html" %}
{% load jalali_tags %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h1>{{ post.title }}</h1>
    <time>{{ post.created_at|jalali }}</time>
    {{ post.body|linebreaks }}
    <p><a href="{% url 'blog:post_list' %}">بازگشت به فهرست</a></p>
{% endblock %}
